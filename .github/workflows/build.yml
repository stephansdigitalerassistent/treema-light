name: Build Treema Light

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.91"
        targets: armv7-linux-androideabi, aarch64-linux-android, i686-linux-android, x86_64-linux-android

    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Android NDK
      run: |
        echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: .

    - name: Build with Gradle
      run: ./gradlew assembleStore_googleDebug --stacktrace
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Upload Rust Native Libraries
      uses: actions/upload-artifact@v4
      with:
        name: rust-native-libs
        path: app/build/generated/source/libthreema/
        if-no-files-found: warn

    - name: Upload Kotlin Bindings
      uses: actions/upload-artifact@v4
      with:
        name: kotlin-bindings
        path: domain/build/generated/source/libthreema/
        if-no-files-found: warn

    - name: Upload Protobuf Generated Files (app)
      uses: actions/upload-artifact@v4
      with:
        name: protobuf-app
        path: app/build/generated/source/protobuf/
        if-no-files-found: warn

    - name: Upload Protobuf Generated Files (domain)
      uses: actions/upload-artifact@v4
      with:
        name: protobuf-domain
        path: domain/build/generated/source/protobuf/
        if-no-files-found: warn
